name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdks/proxy/go.mod
          cache-dependency-path: sdks/proxy/go.mod

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Test
        run: cargo test --locked

      - name: Test Go proxy
        working-directory: sdks/proxy
        run: |
          go test ./...
          go vet ./...

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Build Go proxy
        working-directory: sdks/proxy
        run: |
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../../dist/kekkai-rt-tool-proxy-x86_64-unknown-linux-gnu .

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/kekkai-rt dist/kekkai-rt-x86_64-unknown-linux-gnu
          sha256sum dist/kekkai-rt-x86_64-unknown-linux-gnu > dist/kekkai-rt-x86_64-unknown-linux-gnu.sha256
          sha256sum dist/kekkai-rt-tool-proxy-x86_64-unknown-linux-gnu > dist/kekkai-rt-tool-proxy-x86_64-unknown-linux-gnu.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kekkai-rt-x86_64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 30
