name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release binary
    uses: ./.github/workflows/build.yml

  release:
    name: Upload GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kekkai-rt-x86_64-unknown-linux-gnu
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/kekkai-rt-x86_64-unknown-linux-gnu \
            dist/kekkai-rt-x86_64-unknown-linux-gnu.sha256 \
            dist/kekkai-rt-tool-proxy-x86_64-unknown-linux-gnu \
            dist/kekkai-rt-tool-proxy-x86_64-unknown-linux-gnu.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
