[api]
listen_addr = "0.0.0.0:8080"
token = "replace-me"

[sandbox]
rootfs_dir = "./sysroot" # writable changes persist across container restarts
backend = "runsc"
max_timeout_seconds = 300
network_mode = "nat" # nat, host, or none
network_bridge = "kekkai-rt0"
network_subnet = "10.200.0.0/24"
network_gateway = "10.200.0.1"
network_ip = "10.200.0.2"
network_dns = ["1.1.1.1", "8.8.8.8"]

[features]
# auto, required, or disabled. Auto disables cgroups when memory is unavailable.
cgroups = "auto"

[mounts]
"/workspace" = "./workspace"

# Optional host-side tool proxy. Paths are relative to this config file.
# [tools.'something-cli']
# path = "./something-cli"
# env is optional; omit it to run the tool without injected environment variables.
# env = "./for-something-cli.env"
